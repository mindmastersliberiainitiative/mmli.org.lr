<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MMLI ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0a2a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MMLI Admin">
<style>
:root{--navy:#0a2a4f;--blue:#064282;--red:#c8102e;--ink:#14202e;--mute:#5b6b7d;--line:#dbe3ec;--bg:#eef2f7;--card:#fff;--ok:#1f7a45;--warn:#9a6a00;--r:10px;--shadow:0 1px 2px rgba(10,42,79,.06),0 8px 24px -12px rgba(10,42,79,.18)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb0ea;outline-offset:2px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--blue) 70%)}
#login form{width:min(400px,100%);background:#fff;border-radius:16px;padding:32px 28px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
#login h1{font-size:28px}.sub{margin:-8px 0 4px;color:var(--mute);font-size:14px}
label{display:grid;gap:5px;font-weight:600;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.brand-mark{width:48px;height:48px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 18px "Bricolage Grotesque";border-bottom:4px solid var(--red)}
.brand-mark.sm{width:34px;height:34px;font-size:13px;border-bottom-width:3px;background:#fff;color:var(--navy)}
.form-error{color:var(--red);min-height:1.2em;margin:0;font-size:14px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:#f4f7fb}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#05366a}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.danger:hover{background:#a50d26}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;pointer-events:none}
/* shell */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
#sidebar{background:var(--navy);color:#cfdcec;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;border-right:4px solid transparent;border-image:linear-gradient(#c8102e 33%,#fff 33% 66%,#064282 66%) 1}
.side-head{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;color:#fff;font:700 17px "Bricolage Grotesque"}
.nav-group{margin:14px 10px 4px;font-size:12px;letter-spacing:.06em;color:#7f9bbd;font-weight:700;text-transform:uppercase}
.nav-link{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;text-decoration:none;cursor:pointer;transition:background .15s,padding .15s}
.nav-link:hover{background:rgba(255,255,255,.08);padding-left:16px}
.nav-link.on{background:#fff;color:var(--navy);font-weight:700}
.logout{margin-top:auto;color:#ffb4bf}
main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.topbar h2{font-size:22px;flex:1}.who{font-size:13px;color:var(--mute);text-align:right}.who b{display:block;color:var(--ink)}
#burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;flex-direction:column;justify-content:center;gap:5px;padding:10px}
#burger span{display:block;height:2px;background:var(--navy);border-radius:2px}
#view{padding:24px;outline:none;animation:rise .35s ease both}
#scrim{display:none}
/* cards / stats */
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stat{display:flex;gap:14px;align-items:center;transition:transform .2s,box-shadow .2s;border-left:4px solid var(--blue)}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(10,42,79,.35)}
.stat .ic{font-size:24px;width:44px;height:44px;border-radius:12px;background:#e8f0fa;display:grid;place-items:center}
.stat b{display:block;font:700 28px/1 "Bricolage Grotesque"}.stat span{color:var(--mute);font-size:13px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:16px}
h3{font-size:16px;margin-bottom:12px}
/* charts */
.hbar{display:grid;grid-template-columns:150px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hbar i{display:block;height:10px;border-radius:6px;background:var(--blue);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hbar div{background:#edf1f6;border-radius:6px;overflow:hidden}
.cols{display:flex;gap:6px;align-items:flex-end;height:140px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--mute);height:100%}
.cols i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 0 0;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#edf1f6}.split i{display:block;width:0;transition:width .9s}
.legend{display:flex;gap:14px;font-size:13px;margin-top:8px;flex-wrap:wrap}.legend em{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.feed li:last-child{border:0}.feed small{display:block;color:var(--mute)}
/* toolbar + table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.toolbar>*{flex:1 1 150px;min-width:0}.toolbar .grow{flex:2 1 240px}
.tablewrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);padding:11px 14px;background:#f6f8fb;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:#f3f7fc}
td small{display:block;color:var(--mute)}
.avatar{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#dbe8f7;color:var(--blue);font-weight:700;margin-right:10px;vertical-align:middle}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-pending{background:#fff4cf;color:#7a5a00}.b-review{background:#e3effc;color:#0a3d75}.b-ok{background:#dff3e6;color:#1b6a3d}.b-no{background:#fbe3e6;color:#9a1226}.b-more{background:#ffe9d1;color:#7a4700}.b-off{background:#e9edf2;color:#4a5a69}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;color:var(--mute)}
.empty,.errbox{padding:40px 20px;text-align:center;color:var(--mute)}.errbox{color:var(--red)}
.sk{height:18px;border-radius:6px;background:linear-gradient(90deg,#e6ecf3 25%,#f3f6fa 50%,#e6ecf3 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin:14px}
/* drawer / modal */
#drawer{position:fixed;inset:0;background:rgba(10,42,79,.45);z-index:30;display:flex;justify-content:flex-end;animation:fade .2s}
.drawer-panel{width:min(640px,100%);height:100%;background:#fff;overflow:auto;padding:22px;animation:slide .3s cubic-bezier(.2,.8,.2,1)}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}.dhead img,.dhead .ph{width:84px;height:104px;object-fit:cover;border-radius:10px;background:#e3ebf5;display:grid;place-items:center;color:var(--blue);font-weight:700;font-size:24px}
.dhead h3{font-size:22px;margin:0}.close{margin-left:auto;align-self:flex-start}
.sec{margin:18px 0 6px;font:700 14px "Bricolage Grotesque";color:var(--blue);border-bottom:2px solid var(--line);padding-bottom:4px}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:8px 0;font-size:14px}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.doc{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#modal{position:fixed;inset:0;background:rgba(10,42,79,.55);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal-box{background:#fff;border-radius:14px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;display:grid;gap:12px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal-box.wide{width:min(720px,100%)}.modal-box p{margin:0}.modal-box .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-box img.pv{max-width:100%;border-radius:8px}.modal-box iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--navy);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);animation:pop .25s;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--red)}.toast.ok::before{content:"✓";font-weight:700;color:#7ee2a8}.toast small{display:block;opacity:.8}
/* student card */
.idcard{width:340px;max-width:100%;margin:auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.idcard header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--red)}
.idcard header b{font:700 14px "Bricolage Grotesque"}.idcard header small{display:block;opacity:.8;font-size:11px}
.idcard .body{display:grid;grid-template-columns:100px 1fr;gap:14px;padding:16px}.idcard img,.idcard .ph{width:100px;height:124px;object-fit:cover;border-radius:8px;background:#e3ebf5}
.idcard h3{font-size:18px;margin-bottom:4px}.idcard p{margin:2px 0;font-size:13px}.idcard footer{background:#f3f6fa;padding:8px 16px;font:700 13px "Bricolage Grotesque";color:var(--blue);display:flex;justify-content:space-between}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sh{to{background-position:-200% 0}}
/* mobile */
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 #sidebar{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
 body.nav-open #sidebar{transform:none}
 body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(10,42,79,.5);z-index:15}
 #burger{display:flex}.topbar{padding:8px 12px}#view{padding:14px}.who{display:none}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tbody tr{padding:12px 14px;border-bottom:1px solid var(--line)}
 td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px}
 td::before{content:attr(data-l);color:var(--mute);font-size:12px}td.first::before{display:none}td.first{display:block;padding-bottom:6px}
 dl{grid-template-columns:110px 1fr}
 .hbar{grid-template-columns:100px 1fr 30px}
}
/* print */
@media print{
 body>*:not(#drawer):not(#modal){display:none!important}
 body.print-card #drawer,body.print-card .modal-box>*:not(.idcard){display:none!important}
 body.print-drawer #modal{display:none!important}
 #drawer,#modal{position:static;background:none;display:block!important}
 .drawer-panel,.modal-box{width:100%;box-shadow:none;padding:0;animation:none}
 .actions,.close,.noprint{display:none!important}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* logo + install UI */
.brand-mark{background:#fff;padding:6px;border-bottom-color:var(--red)}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-mark.sm{padding:3px}
#login .brand-mark{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px -8px rgba(10,42,79,.5);border:1px solid var(--line);border-bottom:4px solid var(--red)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px}label.chk input{width:18px;height:18px;min-height:0}
.linkbtn{border:0;background:none;color:var(--blue);min-height:36px}
#install{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));z-index:70;background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -12px rgba(10,42,79,.55);border:1px solid var(--line);border-left:5px solid var(--red);animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#install>img{width:44px;height:44px;object-fit:contain;flex:none}#install>div:nth-child(2){flex:1;min-width:0;font-size:13px;color:var(--mute)}#install b{display:block;color:var(--ink);font-size:14px}
#install .ib{display:flex;gap:6px;flex:none}
#offline{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--red);color:#fff;text-align:center;padding:6px 12px;font-size:13px;font-weight:600}
@media(max-width:560px){#install{flex-wrap:wrap}#install .ib{width:100%;justify-content:flex-end}}
@media(display-mode:standalone){.topbar{padding-top:max(14px,env(safe-area-inset-top))}#sidebar{padding-top:max(16px,env(safe-area-inset-top))}}
@media print{#install,#offline{display:none!important}}
</style>
</head>
<body>
<section id="login" hidden>
  <form id="login-form" autocomplete="on">
    <div class="brand-mark"><img data-logo alt="MMLI logo"></div>
    <h1>MMLI ADMIN</h1>
    <p class="sub">Mind Masters Liberia Initiative — Administrator Management System</p>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" name="remember"> Keep me signed in on this device</label>
    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn linkbtn" type="button" data-install>Install this app</button>
  </form>
</section>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="side-head"><div class="brand-mark sm"><img data-logo alt="MMLI logo"></div><b>MMLI ADMIN</b></div>
    <nav id="nav" aria-label="Main"></nav>
    <button class="nav-link logout" id="logout">Logout</button>
  </aside>
  <div id="scrim"></div>
  <main>
    <header class="topbar">
      <button id="burger" aria-label="Open menu"><span></span><span></span><span></span></button>
      <h2 id="page-title">Dashboard</h2>
      <div class="who" id="who"></div>
    </header>
    <div id="view" tabindex="-1"></div>
  </main>
</div>

<div id="drawer" hidden><div class="drawer-panel" id="drawer-panel"></div></div>
<div id="modal" hidden><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="offline" hidden>You are offline — changes cannot be saved until you reconnect.</div>
<div id="install" hidden role="dialog" aria-label="Install app"><img data-logo alt=""><div><b>Install MMLI Admin</b><span id="install-msg"></span></div><div class="ib"><button class="btn sm primary" id="install-go">Install</button><button class="btn sm" id="install-no">Not now</button></div></div>
<script>

  el.innerHTML = `<div class="errbox"><p><b>Could not load this section.</b></p><p>${esc(err.message)}</p><button class="btn primary" id="retry">Try again</button></div>`;
  $('#retry', el).onclick = retry;
}
function modal(html, wide) {
  const m = $('#modal'), b = $('#modal-box'); b.className = 'modal-box' + (wide ? ' wide' : ''); b.innerHTML = html; m.hidden = false;
  m.onclick = e => { if (e.target === m) closeModal(); }; return b;
}
function closeModal() { $('#modal').hidden = true; $('#modal-box').innerHTML = ''; document.body.classList.remove('print-card'); }
/* confirm dialog -> resolves with {note, extra} or null */
function confirmBox({ title, lines = [], label, danger, note, input, typeConfirm }) {
  return new Promise(res => {
    const b = modal(`<h3>${esc(title)}</h3>${lines.map(l => `<p>${l}</p>`).join('')}
      ${input ? `<label>${esc(input)}<input id="cx"></label>` : ''}
      ${note ? `<label>${esc(note)}<textarea id="cn" rows="3" maxlength="1000"></textarea></label>` : ''}
      ${typeConfirm ? `<label>Type <b>${esc(typeConfirm)}</b> to confirm<input id="ct" autocomplete="off"></label>` : ''}
      <div class="row"><button class="btn" id="cc">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="co" ${typeConfirm ? 'disabled' : ''}>${esc(label)}</button></div>`);
    if (typeConfirm) $('#ct', b).oninput = e => { $('#co', b).disabled = e.target.value !== typeConfirm; };
    $('#cc', b).onclick = () => { closeModal(); res(null); };
    $('#co', b).onclick = () => { const r = { note: $('#cn', b)?.value || '', extra: $('#cx', b)?.value || '' }; closeModal(); res(r); };
  });
}
async function run(btnLabel, fn) { // loading + error toast with retry hint
  try { return await fn(); } catch (e) { toast(e.message, 'err', 'Nothing was changed unless you saw a success message. You can try again.'); return null; }
}
function countUp(el) {
  const to = +el.dataset.count; if (reduce) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function f(t) { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0);
}
function animate(root) {
  root.querySelectorAll('[data-count]').forEach(countUp);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll('[data-w]').forEach(e => e.style.width = e.dataset.w + '%');
    root.querySelectorAll('[data-h]').forEach(e => e.style.height = e.dataset.h + '%');
  }));
}
const b64blob = (b64, mime) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };
const pretty = k => k.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
const val = v => Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object') ? JSON.stringify(v) : String(v ?? '');
const dl = rows => `<dl>${rows.filter(r => val(r[1]).trim()).map(r => `<dt>${esc(r[0])}</dt><dd>${esc(val(r[1]))}</dd>`).join('')}</dl>`;

function buildNav() {
  const ok = p => p === 'any' ? (can('mem') || can('oly')) : can(p); let html = '';
  NAV.forEach(([label, href, p]) => { if (!ok(p)) return; html += href ? `<a class="nav-link" href="${href}">${esc(label)}</a>` : `<div class="nav-group">${esc(label)}</div>`; });
  if (!can('mem') && !can('oly') && !can('log')) html += '<p class="nav-group">No sections available for your role yet</p>';

}
const toggleNav = on => document.body.classList.toggle('nav-open', on);
$('#burger').onclick = () => toggleNav(true); $('#scrim').onclick = () => toggleNav(false);

function start() {
  $('#login').hidden = true; $('#app').hidden = false; buildNav();
  $('#who').innerHTML = `<b>${esc(S.user.name)}</b>${esc(S.user.role)}`;
  if (!location.hash || location.hash === '#') location.hash = (can('mem') || can('oly')) ? '#/dashboard' : '#/users';
  route();
}
addEventListener('hashchange', () => { if (S.user) route(); });

let LST;
function route() {
  toggleNav(false); closeDrawer();
  const h = location.hash.replace(/^#\//, ''), [view, rest = ''] = h.split(/\/(.*)/s);
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('on', a.getAttribute('href') === location.hash));
  const preset = {}; if (rest && rest !== 'all') { const i = rest.indexOf('='); if (i > 0) preset[rest.slice(0, i)] = decodeURIComponent(rest.slice(i + 1)); }
  LST = { q: '', page: 1, sort: 'new', f: {}, preset };
  const v = $('#view'); v.style.animation = 'none'; v.offsetHeight; v.style.animation = '';
  const title = t => $('#page-title').textContent = t;
  const gate = p => { if (!(p === 'any' ? (can('mem') || can('oly')) : can(p))) { v.innerHTML = '<div class="empty">Your role does not include this section.</div>'; return false; } return true; };
  if (view === 'dashboard') { title('Dashboard'); if (gate('any')) dashboard(); }
  else if (view === 'mem') { title(preset.archived ? 'Archived Applications' : preset.status ? pretty(preset.status.toLowerCase()) : 'All Applications'); if (gate('mem')) listView('mem'); }
  else if (view === 'oly') { title(preset.subject ? preset.subject : preset.status ? 'Olympiad — ' + pretty(preset.status.toLowerCase()) : 'All Olympiad Registrations'); if (gate('oly')) listView('oly'); }
  else if (view === 'students') { title('Active Students'); if (gate('oly')) listView('stu'); }
  else if (view === 'log') { title('Activity Log'); if (gate('log')) logView(); }
  else if (view === 'users') { title('Admin Users'); if (gate('super')) usersView(); }
  else { location.hash = '#/dashboard'; }
}

/* ---------- dashboard ---------- */
async function dashboard() {
  const v = $('#view'); v.innerHTML = `<div class="grid stats">${skeleton(4)}</div>`;
  try {
    const d = await api('dashboard'), m = d.mem, o = d.oly, cards = [];
    if (m) cards.push(['👥', m.total, 'Total Members / Applications'], ['⏳', m.pending, 'Pending Applications'], ['✅', m.approved, 'Approved Members'], ['⭐', m.active, 'Active Members'], ['🗄️', m.archived, 'Archived Members']);
    if (o) cards.push(['🎓', o.total, 'Olympiad Registrations'], ['⏳', o.pending, 'Pending Olympiad Registrations'], ['✅', o.approved, 'Approved Olympiad Students'], ['🧮', o.math, 'Mathematics Students'], ['⚛️', o.physics, 'Physics Students']);
    const bars = (obj, tot) => Object.entries(obj).map(([k, n]) => `<div class="hbar"><span>${esc(k)}</span><div><i data-w="${tot ? Math.round(n / tot * 100) : 0}"></i></div><b>${n}</b></div>`).join('') || '<p class="empty">No data yet.</p>';
    const cols = arr => { const mx = Math.max(1, ...arr.map(x => x.n)); return `<div class="cols">${arr.map(x => `<div title="${x.m}: ${x.n}"><span>${x.n || ''}</span><i data-h="${Math.round(x.n / mx * 100)}"></i><span>${x.m.slice(5)}</span></div>`).join('')}</div>`; };
    const split = (a, b, la, lb) => { const t = a + b || 1; return `<div class="split"><i style="background:#064282" data-w="${Math.round(a / t * 100)}"></i><i style="background:#c8102e" data-w="${Math.round(b / t * 100)}"></i></div><div class="legend"><span><em style="background:#064282"></em>${la}: ${a}</span><span><em style="background:#c8102e"></em>${lb}: ${b}</span></div>`; };
    const recent = (rows, nm, id, st, dt) => rows.length ? `<ul class="feed">${rows.map(r => `<li>${esc(r[nm])} ${badge(r[st])}<small>${esc(r[id])} · ${day(r[dt])}</small></li>`).join('')}</ul>` : '<p class="empty">Nothing yet.</p>';
    v.innerHTML = `<div class="grid stats">${cards.map(c => `<div class="card stat"><div class="ic">${c[0]}</div><div><b data-count="${c[1]}">0</b><span>${esc(c[2])}</span></div></div>`).join('')}</div>
    <div class="grid two">
      ${m ? `<div class="card"><h3>Membership status</h3>${bars(m.byStatus, m.total)}</div><div class="card"><h3>Applications over time</h3>${cols(m.byMonth)}</div>
      <div class="card"><h3>Approved vs pending (membership)</h3>${split(m.approved + m.active, m.pending, 'Approved / active', 'Pending')}</div>` : ''}
      ${o ? `<div class="card"><h3>Olympiad registrations over time</h3>${cols(o.byMonth)}</div><div class="card"><h3>Mathematics vs Physics</h3>${split(o.math, o.physics, 'Mathematics', 'Physics')}</div>
      <div class="card"><h3>Approved vs pending (Olympiad)</h3>${split(o.approved, o.pending, 'Approved', 'Pending')}</div>` : ''}
      ${m ? `<div class="card"><h3>Recent applications</h3>${recent(m.recent, 'name', 'ref', 'status', 'submitted')}</div>` : ''}
      ${o ? `<div class="card"><h3>Recent Olympiad registrations</h3>${recent(o.recent, 'name', 'id', 'status', 'date')}</div>` : ''}
      ${d.activity ? `<div class="card"><h3>Recent activity</h3>${actFeed(d.activity)}</div>` : ''}

const actFeed = rows => rows.length ? `<ul class="feed">${rows.map(r => `<li>${esc(r.Action)} ${r.RecordID ? '· ' + esc(r.RecordID) : ''}<small>${esc(r.Name || r.Email)} · ${fmt(r.Timestamp)}</small></li>`).join('')}</ul>` : '<p class="empty">No activity yet.</p>';

/* ---------- list views (membership / olympiad / students) ---------- */
const LV = {

function listView(kind) {
  const cfg = LV[kind], v = $('#view'), flt = cfg.filters.filter(f => !LST.preset[f[0]]);
  v.innerHTML = `<div class="toolbar"><input class="grow" id="q" type="search" placeholder="${esc(cfg.ph)}" aria-label="Search">
    ${flt.map(f => `<select data-f="${f[0]}" aria-label="${f[1]}"><option value="">${f[1]}: all</option></select>`).join('')}
    <input type="date" id="from" aria-label="From date"><input type="date" id="to" aria-label="To date">
    <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name A–Z</option></select></div>
    <div class="tablewrap" id="tbl">${skeleton(6)}</div>`;
  let timer, filled = false;
  const load = async () => {
    const box = $('#tbl'); box.style.opacity = .6;

      const j = await api(cfg.list, { ...LST.preset, ...LST.f, q: LST.q, page: LST.page, sort: LST.sort });
      if (!filled) { filled = true; flt.forEach(f => { const s = $(`[data-f="${f[0]}"]`); (f[2] ? j[f[2]] : j.facets[f[0]] || []).forEach(o => s.insertAdjacentHTML('beforeend', `<option>${esc(o)}</option>`)); }); }
      LST.page = j.page;
      box.innerHTML = j.rows.length ? `<table><thead><tr>${cfg.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${j.rows.map(r => `<tr tabindex="0" data-k="${esc(cfg.key(r))}">${cfg.row(r).map((c, i) => `<td class="${i ? '' : 'first'}" data-l="${cfg.cols[i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <div class="pager"><span>${j.total} record${j.total === 1 ? '' : 's'}</span><span><button class="btn sm" id="pv" ${j.page <= 1 ? 'disabled' : ''}>Previous</button> Page ${j.page} of ${j.pages} <button class="btn sm" id="nx" ${j.page >= j.pages ? 'disabled' : ''}>Next</button></span></div>`
        : '<div class="empty"><p><b>No records match.</b></p><p>Clear the search or filters to see everything in this list.</p></div>';
      box.querySelectorAll('tbody tr').forEach(tr => { const go = () => cfg.open(tr.dataset.k); tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter') go(); }; });
      if ($('#pv')) { $('#pv').onclick = () => { LST.page--; load(); }; $('#nx').onclick = () => { LST.page++; load(); }; }

  $('#q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { LST.q = e.target.value; LST.page = 1; load(); }, 300); };

  $('#from').onchange = e => { LST.f.from = e.target.value; LST.page = 1; load(); }; $('#to').onchange = e => { LST.f.to = e.target.value; LST.page = 1; load(); };

}

function openDrawer(html) { $('#drawer-panel').innerHTML = html; $('#drawer').hidden = false; $('#drawer').onclick = e => { if (e.target.id === 'drawer') closeDrawer(); }; $('#drawer-panel').scrollTop = 0; }

/* ---------- membership profile ---------- */
const MEM_ACT = { 'APPROVED': ['Approve', 'Approve Application'], 'REJECTED': ['Reject', 'Reject Application', 1], 'UNDER REVIEW': ['Put Under Review', 'Move to Under Review'], 'MORE INFORMATION REQUIRED': ['Request More Information', 'Request Information'],
  'ACTIVE MEMBER': ['Mark Active Member', 'Mark Active Member'], 'INACTIVE': ['Mark Inactive', 'Mark Inactive', 1], 'PENDING REVIEW': ['Return to Pending', 'Return to Pending'] };
async function openMem(ref) {
  openDrawer(skeleton(8));
  try {
    const { record: r } = await api('memGet', { reference: ref }), p = r.profile || {};
    const guardian = Object.entries(p).filter(([k]) => /^guardian/.test(k)), rest = Object.entries(p).filter(([k]) => !/^guardian/.test(k));
    const photo = r.files.find(f => f.kind === 'passport_photo');
    const w = can('memw');
    openDrawer(`<div class="dhead"><div class="ph" id="ph">${esc((r.name || '?')[0])}</div><div><h3>${esc(r.name)}</h3><p>${esc(r.ref)}</p>${badge(r.status)}${r.archived ? ' <span class="badge b-off">ARCHIVED</span>' : ''}</div><button class="btn sm close" id="x">Close</button></div>
      <div class="sec">Membership</div>${dl([['Application reference', r.ref], ['Engagement', r.type], ['Category', r.category], ['Profile type', r.kind], ['Status', r.status], ['Membership ID', r.membershipId], ['Submitted', fmt(r.submitted)], ['Last updated', fmt(r.updated)]])}
      <div class="sec">${r.kind === 'individual' ? 'Applicant' : 'Organization / Institution'}</div>${dl([['Email', r.email], ['Phone', r.phone], ...rest.map(([k, x]) => [pretty(k), x])])}
      ${guardian.length ? `<div class="sec">Guardian</div>${dl(guardian.map(([k, x]) => [pretty(k.replace(/^guardian_?/, 'guardian ')), x]))}` : ''}
      ${Object.keys(r.details || {}).length ? `<div class="sec">Application details</div>${dl(Object.entries(r.details).map(([k, x]) => [pretty(k), x]))}` : ''}
      <div class="sec">Supporting documents</div>${r.files.length ? r.files.map((f, i) => `<div class="doc"><span>${esc(f.name)}</span><button class="btn sm" data-doc="${i}">View / download</button></div>`).join('') : '<p class="empty">No documents uploaded.</p>'}
      <div class="sec noprint">Actions</div><div class="actions noprint">
        <button class="btn sm" id="pr">Print application</button>
        ${w ? Object.keys(MEM_ACT).filter(s => s !== r.status).map(s => `<button class="btn sm ${MEM_ACT[s][2] ? '' : 'primary'}" data-st="${s}">${MEM_ACT[s][0]}</button>`).join('') : ''}
        ${w ? `<button class="btn sm" id="ar">${r.archived ? 'Restore from archive' : 'Archive'}</button>` : ''}
        ${can('super') && r.archived ? '<button class="btn sm danger" id="del">Delete permanently</button>' : ''}</div>`);
    $('#x').onclick = closeDrawer; $('#pr').onclick = printDrawer;
    if (photo) api('memFile', { id: photo.id, reference: ref }).then(f => { $('#ph').outerHTML = `<img src="data:${f.mime};base64,${f.data}" alt="Applicant photo">`; }).catch(() => {});
    document.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => viewDoc(r.files[+b.dataset.doc], ref, b));
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      const s = b.dataset.st, a = MEM_ACT[s];
      const c = await confirmBox({ title: a[0] + ' this application?', lines: [`Applicant:<br><b>${esc(r.name)}</b>`, `Reference:<br><b>${esc(r.ref)}</b>`, `Status will change from ${esc(r.status)} to <b>${esc(s)}</b>.`], label: a[1], danger: a[2] === 1 && s === 'REJECTED', note: 'Message to applicant (optional, included in the status email)' });
      if (!c) return; b.disabled = true;
      const j = await run('', () => api('memStatus', { reference: ref, status: s, note: c.note }));
      if (j) { toast('Application updated successfully', 'ok', `${ref}: ${j.from} → ${j.to}`); openMem(ref); refreshList(); } else b.disabled = false;
    });
    if ($('#ar')) $('#ar').onclick = async () => {
      const arch = !r.archived, c = await confirmBox({ title: arch ? 'Archive this application?' : 'Restore this application?', lines: [`<b>${esc(r.name)}</b><br>${esc(r.ref)}`, arch ? 'It will be hidden from normal lists but nothing is deleted.' : 'It will return to the normal lists.'], label: arch ? 'Archive' : 'Restore' });
      if (!c) return; const j = await run('', () => api('memArchive', { reference: ref, archive: arch }));
      if (j) { toast(arch ? 'Application archived' : 'Application restored', 'ok', ref); closeDrawer(); refreshList(); }
    };
    if ($('#del')) $('#del').onclick = async () => {
      const c = await confirmBox({ title: 'Permanently delete this application?', lines: ['<b>This cannot be undone.</b> The row is removed from the Membership sheet. Uploaded files stay in Drive.', `<b>${esc(r.name)}</b><br>${esc(r.ref)}`], label: 'Delete permanently', danger: true, typeConfirm: r.ref });
      if (!c) return; const j = await run('', () => api('memDelete', { reference: ref, confirm: ref }));
      if (j) { toast('Application permanently deleted', 'ok', ref); closeDrawer(); refreshList(); }
    };
  } catch (e) { openDrawer(''); failBox($('#drawer-panel'), e, () => openMem(ref)); }
}
const refreshList = () => { if (/^#\/(mem|oly|students)/.test(location.hash)) route(); };
async function viewDoc(f, ref, btn) {
  btn.disabled = true; btn.textContent = 'Loading…';
  try {
    const d = await api('memFile', { id: f.id, reference: ref }), url = URL.createObjectURL(b64blob(d.data, d.mime));
    const b = modal(`<h3>${esc(f.name)}</h3>${d.mime.startsWith('image/') ? `<img class="pv" src="${url}" alt="">` : d.mime === 'application/pdf' ? `<iframe src="${url}" title="Document preview"></iframe>` : '<p>No preview for this file type.</p>'}
      <div class="row"><button class="btn" id="dc">Close</button><a class="btn primary" href="${url}" download="${esc(d.name)}">Download</a></div>`, true);
    $('#dc', b).onclick = () => { closeModal(); URL.revokeObjectURL(url); };
  } catch (e) { toast(e.message, 'err'); }
  btn.disabled = false; btn.textContent = 'View / download';
}

/* ---------- olympiad profile ---------- */
async function openOly(id) {
  openDrawer(skeleton(8));
  try {
    const { record: r } = await api('olyGet', { id }), w = can('olyw'), name = [r.FirstName, r.MiddleName, r.LastName].filter(Boolean).join(' ');
    openDrawer(`<div class="dhead"><div class="ph" id="ph">${esc((r.FirstName || '?')[0])}</div><div><h3>${esc(name)}</h3><p>${esc(r.RegistrationID)}${r.StudentID ? ' · ' + esc(r.StudentID) : ''}</p>${badge(r.Status)}</div><button class="btn sm close" id="x">Close</button></div>
      <div class="sec">Student</div>${dl([['Student ID', r.StudentID], ['Registration ID', r.RegistrationID], ['Preferred name', r.PreferredName], ['Date of birth', r.DateOfBirth], ['Gender', r.Gender], ['Phone', r.StudentPhone], ['Email', r.StudentEmail], ['County', r.County], ['Community', r.Community]])}
      <div class="sec">Academic</div>${dl([['School', r.SchoolName], ['School location', r.SchoolLocation], ['School county', r.SchoolCounty], ['Grade', r.Grade], ['Academic year', r.AcademicYear], ['Olympiad subject', r.Subject], ['Training level', r.Level], ['Training format', r.TrainingFormat], ['Teacher', [r.TeacherName, r.TeacherPhone].filter(Boolean).join(' · ')]])}
      <div class="sec">Training</div>${dl([['Previous competition', r.PreviousCompetition], ['Competition', [r.CompetitionName, r.CompetitionYear, r.CompetitionSubject, r.CompetitionResult].filter(Boolean).join(' · ')], ['Olympiad experience', r.OlympiadExperience], ['Olympiad', [r.OlympiadName, r.OlympiadYear, r.OlympiadCountry, r.OlympiadResult].filter(Boolean).join(' · ')], ['Mathematics areas studied', r.MathAreasStudied], ['Mathematics area to improve', r.MathAreaToImprove], ['Physics areas studied', r.PhysicsAreasStudied], ['Physics area to improve', r.PhysicsAreaToImprove], ['Weekly commitment (hours)', r.WeeklyTrainingHours], ['Goals', r.StudentGoals], ['Motivation', r.StudentMotivation]])}
      <div class="sec">Parent / guardian</div>${dl([['Name', r.ParentGuardianName], ['Relationship', r.Relationship], ['Phone', r.ParentPhone], ['Alternative phone', r.AlternativeParentPhone], ['Email', r.ParentEmail], ['Community', r.ParentCommunity], ['Preferred contact', r.PreferredCommunication], ['WhatsApp', r.WhatsAppNumber]])}
      <div class="sec">Emergency contact</div>${dl([['Name', r.EmergencyContactName], ['Relationship', r.EmergencyRelationship], ['Phone', r.EmergencyPhone], ['Alternative phone', r.EmergencyAlternativePhone]])}
      <div class="sec">Review</div>${dl([['Registered', fmt(r.RegistrationDate)], ['Reviewed by', r.ReviewedBy], ['Review date', fmt(r.ReviewDate)], ['Approval date', fmt(r.ApprovalDate)], ['Training group', r.TrainingGroup], ['Notes', r.Notes], ['Duplicate check', r.DuplicateFlag]])}
      <div class="sec noprint">Actions</div><div class="actions noprint">
        <button class="btn sm" id="pr">Print profile</button>
        ${r.StudentID ? '<button class="btn sm primary" id="card">Student card</button>' : ''}
        ${w && r.Status !== 'APPROVED' ? '<button class="btn sm primary" id="ap">Approve</button>' + ['UNDER REVIEW', 'WAITLISTED', 'REJECTED', 'PENDING'].filter(s => s !== r.Status).map(s => `<button class="btn sm" data-st="${s}">${pretty(s.toLowerCase())}</button>`).join('') : ''}</div>`);
    $('#x').onclick = closeDrawer; $('#pr').onclick = printDrawer;
    api('olyPhoto', { id }).then(p => { if (p.photo) $('#ph').outerHTML = `<img src="${p.photo}" alt="Student photo">`; }).catch(() => {});
    if ($('#card')) $('#card').onclick = () => showCard(r.StudentID);
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
      const s = b.dataset.st, c = await confirmBox({ title: `Mark as ${pretty(s.toLowerCase())}?`, lines: [`Student:<br><b>${esc(name)}</b>`, `Registration:<br><b>${esc(r.RegistrationID)}</b>`], label: 'Confirm', danger: s === 'REJECTED', note: 'Internal note (optional)' });
      if (!c) return; const j = await run('', () => api('olyReview', { id, status: s, note: c.note }));
      if (j) { toast('Registration updated successfully', 'ok', `${id}: ${j.from} → ${j.to}`); openOly(id); refreshList(); }
    });
    if ($('#ap')) $('#ap').onclick = async () => {
      const c = await confirmBox({ title: 'Approve this student?', lines: [`Student:<br><b>${esc(name)}</b>`, `Registration:<br><b>${esc(r.RegistrationID)}</b>`, 'This creates the student record and Student ID (once).'], label: 'Approve Student', input: 'Training group (optional)' });
      if (!c) return; const j = await run('', () => api('olyApprove', { id, group: c.extra }));
      if (j) { toast('Student approved successfully', 'ok', `${id} → ${j.studentId}`); openOly(id); refreshList(); }
    };
  } catch (e) { openDrawer(''); failBox($('#drawer-panel'), e, () => openOly(id)); }
}
async function showCard(studentId) {
  const b = modal(skeleton(4));
  try {
    const { card: c } = await api('olyCard', { studentId });
    b.innerHTML = `<div class="idcard"><header><div class="brand-mark sm"><img src="${LOGO}" alt=""></div><div><b>Mind Masters Liberia Initiative</b><small>Olympiad Training · Student Card</small></div></header>
      <div class="body">${c.Photo ? `<img src="${c.Photo}" alt="Student photo">` : '<div class="ph"></div>'}<div><h3>${esc([c.FirstName, c.LastName].join(' '))}</h3><p><b>${esc(c.Subject)}</b></p><p>Grade ${esc(c.Grade)} · ${esc(c.Level)}</p><p>${esc(c.SchoolName)}</p>${c.TrainingGroup ? `<p>Group: ${esc(c.TrainingGroup)}</p>` : ''}</div></div>
      <footer><span>${esc(c.StudentID)}</span><span>${esc(c.Status)}</span></footer></div>
      <div class="row noprint"><button class="btn" id="cl">Close</button><button class="btn primary" id="pc">Print card / Save as PDF</button></div>`;
    $('#cl', b).onclick = closeModal; $('#pc', b).onclick = () => { document.body.classList.add('print-card'); print(); setTimeout(() => document.body.classList.remove('print-card'), 500); };
  } catch (e) { closeModal(); toast(e.message, 'err'); }
}

/* ---------- activity log ---------- */
async function logView() {
  const v = $('#view'); v.innerHTML = `<div class="toolbar"><select id="lm"><option value="">All modules</option><option>Auth</option><option>Membership</option><option>Olympiad</option><option>Administration</option></select></div><div class="tablewrap" id="tbl">${skeleton(6)}</div>`;
  const load = async () => {
    const box = $('#tbl');
    try {
      const j = await api('logList', { module: $('#lm').value });
      box.innerHTML = j.rows.length ? `<table><thead><tr><th>Time</th><th>Administrator</th><th>Module</th><th>Action</th><th>Record</th><th>Change</th></tr></thead><tbody>${j.rows.map(r => `<tr style="cursor:default"><td class="first" data-l="Time">${fmt(r.Timestamp)}</td><td data-l="Administrator">${esc(r.Name || r.Email)}<small>${esc(r.Role)}</small></td><td data-l="Module">${esc(r.Module)}</td><td data-l="Action">${esc(r.Action)}</td><td data-l="Record">${esc(r.RecordID)}</td><td data-l="Change">${esc(r.From)}${r.To ? ' → ' + esc(r.To) : ''}<small>${esc(r.Details)}</small></td></tr>`).join('')}</tbody></table><div class="pager"><span>Latest ${j.rows.length} entries. Log is append-only.</span></div>` : '<div class="empty">No activity recorded yet.</div>';
    } catch (e) { failBox(box, e, load); }
  };
  $('#lm').onchange = load; load();
}

/* ---------- admin users ---------- */
async function usersView() {
  const v = $('#view'); v.innerHTML = `<div class="toolbar"><button class="btn primary" id="nu" style="flex:0 0 auto">Add administrator</button></div><div class="tablewrap" id="tbl">${skeleton(4)}</div>`;
  let roles = [];
  const load = async () => {
    const box = $('#tbl');
    try {
      const j = await api('usersList'); roles = j.roles;
      box.innerHTML = `<table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th>Created</th></tr></thead><tbody>${j.users.map(u => `<tr data-e="${esc(u.email)}"><td class="first" data-l="Name"><span class="avatar">${esc((u.name || '?')[0])}</span><b>${esc(u.name)}</b><small>${esc(u.email)}</small></td><td data-l="Role">${esc(u.role)}</td><td data-l="Status">${badge(u.status)}</td><td data-l="Last login">${fmt(u.lastLogin)}</td><td data-l="Created">${day(u.created)}</td></tr>`).join('')}</tbody></table>`;
      box.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => form(j.users.find(u => u.email === tr.dataset.e)));
    } catch (e) { failBox(box, e, load); }
  };
  const form = u => {
    const b = modal(`<h3>${u ? 'Edit administrator' : 'Add administrator'}</h3><label>Name<input id="fn" value="${esc(u?.name)}"></label><label>Email<input id="fe" type="email" value="${esc(u?.email)}" ${u ? 'disabled' : ''}></label>
      <label>Role<select id="fr">${roles.map(r => `<option ${u?.role === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>
      <label>Status<select id="fs"><option>ACTIVE</option><option ${u?.status === 'DISABLED' ? 'selected' : ''}>DISABLED</option></select></label>
      <label>${u ? 'Reset access: new password (leave empty to keep)' : 'Temporary password (min. 10 characters)'}<input id="fp" type="password" autocomplete="new-password"></label>
      <div class="row">${u ? '<button class="btn danger" id="fd" style="margin-right:auto">Remove</button>' : ''}<button class="btn" id="fc">Cancel</button><button class="btn primary" id="fx">Save</button></div>`);
    $('#fc', b).onclick = closeModal;
    $('#fx', b).onclick = async () => {
      const j = await run('', () => api('userSave', { name: $('#fn', b).value, email: $('#fe', b).value, role: $('#fr', b).value, status: $('#fs', b).value, password: $('#fp', b).value }));
      if (j) { closeModal(); toast('Administrator saved successfully', 'ok'); load(); }
    };
    if (u) $('#fd', b).onclick = async () => {
      const c = await confirmBox({ title: 'Remove this administrator?', lines: [`<b>${esc(u.name)}</b><br>${esc(u.email)}`, 'Their access ends immediately. Their past activity stays in the log.'], label: 'Remove administrator', danger: true });
      if (!c) return; const j = await run('', () => api('userRemove', { email: u.email })); if (j) { toast('Administrator removed', 'ok'); load(); }
    };
  };
  $('#nu').onclick = () => form(null); load();
}

/* ---------- boot ---------- */
(async function () {
  if (S.token) { try { const j = await api('me'); S.user = j.user; return start(); } catch (e) {} }
  signedOut();
})();

</script>
</body>
