<meta name="apple-mobile-web-app-title" content="MMLI Admin"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MMLI Olympiad Admin</title>
<style>
:root{--n:#064282;--b:#d9e0ea;--bg:#f4f7fb;--t:#1b2433}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--n);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px;border-bottom:4px solid #ffc400}header img{width:46px;height:46px;border-radius:10px;background:#fff;padding:3px}h1{font-size:1.05rem;margin:0;line-height:1.2}h1 small{display:block;font-weight:500;color:#ffc400;font-size:.75rem;letter-spacing:.04em}.lgn{display:block;width:96px;height:96px;margin:4px auto 10px}main{max-width:760px;margin:0 auto;padding:12px}
.c{background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px;margin:0 0 10px}
input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;margin:4px 0}
button{background:var(--n);color:#fff;border:0;font-weight:700;min-height:44px;cursor:pointer}button.s{background:#fff;color:var(--n);border:2px solid var(--n)}button.d{background:#b3261e}
.tabs{display:flex;gap:8px}.tabs button{margin:0}
.chip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#e8eef7;color:var(--n)}.chip.APPROVED,.chip.ACTIVE{background:#dff3e4;color:#1a6b34}.chip.REJECTED{background:#fbe3e1;color:#b3261e}
.row{cursor:pointer}.dup{color:#b3261e;font-size:.8rem;font-weight:700}
dl{display:grid;grid-template-columns:1fr 1.4fr;gap:4px 10px;margin:0;font-size:.88rem}dt{color:#5b6677}dd{margin:0;word-break:break-word}
img.ph{width:100%;max-width:260px;border-radius:10px;display:block;margin:8px 0}#msg{color:#b3261e;min-height:1.2em}
@media print{header,.no,.tabs,#fl,#ls{display:none}}
</style></head><body>
<header><img class="lg" alt="MMLI logo"><h1>MMLI Olympiad Training<small>Administrator</small></h1></header>
<main>
<div id="ib" class="c" hidden><b>Install the MMLI Admin app</b><p style="margin:4px 0">Add it to your phone for one-tap access.</p><button id="ibtn">Install app</button></div>
<div id="ios" class="c" hidden><b>Install on iPhone:</b> tap the Share button, then <b>Add to Home Screen</b>.</div>
<div id="lg" class="c"><img class="lg lgn" alt="" style="background:none;padding:0"><input id="an" placeholder="Your name" autocomplete="name"><input id="tk" type="password" placeholder="Admin token" autocomplete="off"><button onclick="login()">Sign in</button><div id="msg"></div></div>
<div id="app" hidden>
<div class="tabs"><button onclick="show('reg')">Registrations</button><button class="s" onclick="show('stu')">Students</button></div>
<select id="fl" onchange="show('reg')"><option value="">All</option><option>PENDING</option><option>UNDER REVIEW</option><option>WAITLISTED</option><option>APPROVED</option><option>REJECTED</option></select>
<div id="ls"></div><div id="det"></div>
</div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbyIAI_nmtNpkRB5fuopJVzPlm_-FqHjucuc9Sq34o4RmUW0bnJpvylxDldmI-8yYjsV/exec';
let T='',A='';const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({Module:'OLYMPIAD',Token:T,Admin:A},o))});const j=await r.json();if(!j.ok)throw new Error(j.error||'Failed');return j}
async function login(){A=$('#an').value.trim();T=$('#tk').value.trim();if(!A||!T){$('#msg').textContent='Enter your name and token';return}
try{await call({Action:'list',Status:'NONE'});$('#lg').hidden=true;$('#app').hidden=false;show('reg')}catch(e){T='';$('#msg').textContent=e.message==='unauthorized'?'Wrong token (5 wrong tries locks sign-in for 10 minutes)':'Could not connect'}}
async function show(v){$('#det').innerHTML='';$('#fl').hidden=v!=='reg';$('#ls').innerHTML='<p>Loading...</p>';
try{if(v==='reg'){const r=await call({Action:'list',Status:$('#fl').value});
$('#ls').innerHTML=r.records.reverse().map(x=>`<div class="c row" onclick="openReg('${esc(x.RegistrationID)}')"><b>${esc(x.FirstName)} ${esc(x.LastName)}</b> <span class="chip ${esc(x.Status)}">${esc(x.Status)}</span><br>${esc(x.Subject)} · ${esc(x.Level)} · Grade ${esc(x.Grade)}<br>${esc(x.SchoolName)}${x.DuplicateFlag?'<div class="dup">POSSIBLE DUPLICATE</div>':''}</div>`).join('')||'<p>No registrations.</p>'}
else{const r=await call({Action:'students'});
$('#ls').innerHTML=r.students.map(x=>`<div class="c row" onclick="card('${esc(x.StudentID)}')"><b>${esc(x.FirstName)} ${esc(x.LastName)}</b> <span class="chip ACTIVE">${esc(x.StudentID)}</span><br>${esc(x.Subject)} · ${esc(x.TrainingGroup)||'No group'}</div>`).join('')||'<p>No approved students yet.</p>'}
}catch(e){$('#ls').textContent='Error: '+e.message}}
async function openReg(id){const d=$('#det');d.innerHTML='<div class="c">Loading...</div>';
try{const r=(await call({Action:'get',RegistrationID:id})).record;
d.innerHTML=`<div class="c"><h3>${esc(r.FirstName)} ${esc(r.LastName)} <span class="chip ${esc(r.Status)}">${esc(r.Status)}</span></h3><button class="s no" onclick="photo('${id}')">Show photo</button><div id="ph"></div><dl>${Object.entries(r).filter(([k,v])=>v!==''&&k!=='PhotoFileID').map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
<div class="c no"><textarea id="nt" rows="3" placeholder="Review notes">${esc(r.Notes)}</textarea>
<button class="s" onclick="rev('${id}','UNDER REVIEW')">Mark under review</button><button class="s" onclick="rev('${id}','WAITLISTED')">Waitlist</button><button class="d" onclick="rev('${id}','REJECTED')">Reject</button>
<input id="gp" placeholder="Training group (e.g. Group A)" value="${esc(r.TrainingGroup)}"><button onclick="appr('${id}')">Approve and create student record</button></div>`;
d.scrollIntoView()}catch(e){d.innerHTML='<div class="c">Error: '+esc(e.message)+'</div>'}}
async function photo(id){try{const r=await call({Action:'photo',RegistrationID:id});$('#ph').innerHTML=r.photo?'<img class="ph" src="'+r.photo+'">':'No photo'}catch(e){alert(e.message)}}
async function rev(id,st){try{await call({Action:'review',RegistrationID:id,Status:st,Notes:$('#nt').value});alert('Saved: '+st);show('reg')}catch(e){alert(e.message)}}
async function appr(id){if(!confirm('Approve this student?'))return;try{const r=await call({Action:'approve',RegistrationID:id,TrainingGroup:$('#gp').value});alert('Student ID: '+r.studentId);show('reg')}catch(e){alert(e.message)}}
async function card(sid){const d=$('#det');d.innerHTML='<div class="c">Loading...</div>';
try{const c=(await call({Action:'card',StudentID:sid})).card;
d.innerHTML=`<div class="c" style="max-width:340px;text-align:center;border:2px solid var(--n)"><img class="lg" alt="" style="width:54px;height:54px;display:block;margin:0 auto 4px"><b style="color:var(--n)">MMLI OLYMPIAD TRAINING</b>${c.Photo?'<img class="ph" style="margin:10px auto" src="'+c.Photo+'">':''}<h3 style="margin:4px 0">${esc(c.FirstName)} ${esc(c.LastName)}</h3><div class="chip ACTIVE">${esc(c.StudentID)}</div><p>${esc(c.Subject)}<br>${esc(c.Level)} · Grade ${esc(c.Grade)}<br>${esc(c.SchoolName)}<br>${esc(c.TrainingGroup)}</p></div><button class="s no" onclick="print()">Print card</button>`;
d.scrollIntoView()}catch(e){d.innerHTML='<div class="c">Error: '+esc(e.message)+'</div>'}}
